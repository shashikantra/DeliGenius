services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: deli_rag_pg
    environment:
      POSTGRES_USER: deli
      POSTGRES_PASSWORD: sheetal123
      POSTGRES_DB: deli_rag
    ports:
      - "5434:5432"           # 5433 avoids clashing with any local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deli -d deli_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: