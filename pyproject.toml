[project]
name = "deli-rag-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pgvector>=0.3",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  # Parsers (Commit #2 will use these)
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pandas>=2.2",

  # Embeddings (Commit #3)
  "sentence-transformers>=3.0",

  # Orchestration (later phases)
  "langgraph>=0.2",
  "langchain-groq>=0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
deli-rag = "deli_rag.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]