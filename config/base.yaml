version: 1
config_version: "2026-10-15.1"

embedder:
  name: BAAI/bge-small-en-v1.5
  dim: 384
  max_tokens: 512
  normalize: true

reranker:                          # Phase 2
  name: BAAI/bge-reranker-base
  top_k_in: 30
  top_k_out: 8
  min_score: 0.30

retrieval:
  dense_top_k: 20
  keyword_top_k: 20
  rrf_k: 60
  final_top_k: 8

llm:
  primary:    { id: openai/gpt-oss-20b,  roles: [generate, rewrite, classify, route], verified: true }
  fallback_1: { id: openai/gpt-oss-120b, roles: [generate, judge, sql],               verified: true }
  fallback_2: { id: qwen/qwen3-32b,      roles: [generate],                          verified: false }

  ollama:
    id:  "llama3" #"phi3"
    base_url: "http://localhost:11434/v1"
    roles: [generate, sql]
    verified: true

  fallback_on: [429, 500, 502, 503, 504, timeout]
  retry_backoff_s: [1, 3]

budgets:
  answer_max_tokens: 800
  context_max_tokens: 4000
  agent_max_iterations: 2
  latency_p95_budget_s: 20

compression:
  dedup_by_hash: true
  min_score: 0.005
  merge_adjacent: true
  max_merged_tokens: 700
  max_total_tokens: 3000
  min_chunks_to_keep: 3
  max_chunks: 8

agent:
  # model roles
  intent_model: openai/gpt-oss-20b
  generation_model: openai/gpt-oss-20b
  judge_model: openai/gpt-oss-120b
  max_evidence_blocks: 8
  max_answer_tokens: 500
  # loop controls
  max_iterations: 2
  min_confidence: 0.55
  broaden_factor: 2.0
  max_k: 24
  reroute_on_retry: true
  latency_budget_s: 20.0

chunking:
  parent_max_tokens: 1200
  child_target_tokens: 220
  child_max_tokens: 320
  child_min_tokens: 80
  overlap_tokens: 40
  context_line_max_tokens: 40

access:
  default_email_acl: internal      # PROPOSED — flagged in DECISIONS §9
  levels: [public, internal, confidential]

freshness:
  stale_after_days: 180
  downweight_factor: 0.5

